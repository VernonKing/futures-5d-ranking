name: Update market data and deploy Pages

on:
  schedule:
    # GitHub cron uses UTC. Sina can publish individual daily bars hours after
    # the close, so retry in stages and stop once today's full snapshot exists.
    - cron: "0 8 * * 1-5"
    - cron: "25 8 * * 1-5"
    - cron: "0 9 * * 1-5"
    - cron: "0 10 * * 1-5"
    - cron: "0 12 * * 1-5"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "generator/**"
      - "site/index.html"
      - "site/styles.css"
      - "site/app.js"
      - "site/.nojekyll"
      - "tests/**"
      - "requirements.txt"
      - ".github/workflows/deploy.yml"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Check snapshot freshness
        id: freshness
        run: python3 -m generator.freshness --output site/data/latest.json

      - name: Set up Python
        if: steps.freshness.outputs.needs_update == 'true'
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        if: steps.freshness.outputs.needs_update == 'true'
        run: python -m pip install -r requirements.txt

      - name: Run tests
        if: steps.freshness.outputs.needs_update == 'true'
        run: python -m unittest discover -s tests -v

      - name: Build latest market snapshot
        if: steps.freshness.outputs.needs_update == 'true'
        run: python -m generator.build --output site/data/latest.json

      - name: Persist generated snapshot
        if: steps.freshness.outputs.needs_update == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/data/latest.json
          git diff --cached --quiet || git commit -m "data: update futures ranking snapshot"
          git push

      - name: Configure Pages
        if: steps.freshness.outputs.needs_update == 'true'
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        if: steps.freshness.outputs.needs_update == 'true'
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

      - name: Deploy Pages
        if: steps.freshness.outputs.needs_update == 'true'
        id: deployment
        uses: actions/deploy-pages@v4
